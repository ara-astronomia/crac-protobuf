// data_image.proto

syntax = "proto3";

// Message carrying the CCD image configuration
message CCDImageData {
    // Field of view width, in arcminutes
    double field_of_view_width = 1;
    // Field of view height, in arcminutes
    double field_of_view_height = 2;
}

// Service to request image generation settings
service ImageConfigService {
    rpc GetCCDImageData (ImageConfigRequest) returns (CCDImageData);
}

// Empty request
message ImageConfigRequest {}
// geographic.proto

syntax = "proto3";

// Message carrying geographic data
message GeographicData {
    double latitude = 1;
    double longitude = 2;
    // Elevation matters for astroplan, optional when not needed
    double elevation_meters = 3; 
}

// gRPC service to request geographic information
service GeographicService {
    rpc GetGeographicInfo (GeographicRequest) returns (GeographicData);
}

// Empty request, no parameters needed
message GeographicRequest {}
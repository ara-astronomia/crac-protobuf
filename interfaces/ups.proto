syntax = "proto3";
import "crac_protobuf/chart.proto";

message UpsResponse {
  int32 updated_at = 7;
  repeated UpsChart charts = 8;
  // Worst state across devices, UPS_STATUS_UNSPECIFIED if any device is
  // unreadable. See device_states to tell which device is failing.
  UpsStatus status = 9;
  int32 interval = 10;
  // Only the devices that answered. Deprecated by device_states.
  repeated string devices = 11;
  repeated UpsDevice device_states = 12;
}

message UpsDevice {
  string name = 1;
  // UPS_STATUS_UNSPECIFIED when the device could not be read: unlike
  // devices, an unreachable device is still listed here.
  UpsStatus status = 2;
}

message UpsRequest {

}

enum UpsStatus {
  UPS_STATUS_UNSPECIFIED = 0;
  UPS_STATUS_NORMAL = 1;
  UPS_STATUS_WARNING = 2;
  UPS_STATUS_DANGER = 3;
}

enum BatteryStatus {
  BATTERY_STATUS_UNSPECIFIED = 0;
  BATTERY_STATUS_DISCHARGE = 1;
  BATTERY_STATUS_ONLINE = 2;
  BATTERY_STATUS_ONBATTERY = 3;
  BATTERY_STATUS_LOWBATTERY = 4;
}

message UpsChart {
  Chart chart = 1;
  // NUT ups.status flags, on the battery chart. Repeated because NUT
  // reports several at once ("OL CHRG", "OB LB").
  repeated BatteryStatus battery_statuses = 2;
}

service Ups {
  rpc GetStatus(UpsRequest) returns (UpsResponse);
}
